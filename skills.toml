# Claude Code Skills Coordinator — configuration
# All repos, plugins, skills, and agents in one file.

[repos]
claude-kaiser-skills = "https://github.com/wolski/claude-kaiser-skills.git"
posit-dev-skills     = "https://github.com/posit-dev/skills.git"
marimo-team-skills   = "https://github.com/marimo-team/skills.git"
anthropics-skills    = "https://github.com/anthropics/skills.git"
google-deepmind-science-skills = "https://github.com/google-deepmind/science-skills.git"
fgcz-skills          = "git@github.com:fgcz/skills.git"

[plugins.claude-plugins-official]
names = [
    "code-simplifier",
    "claude-md-management",
    "code-review",
    "hookify",
]

# ─── Skills per repo ───────────────────────────────────────────────
# Each [skills.<repo>] must match a key in [repos].
# paths  = skill directories symlinked to ~/.claude/skills/
# agents = agent .md files symlinked to ~/.claude/agents/

[skills.claude-kaiser-skills]
paths = [
    "r-development",
    "python-style-guide",
    "mixed-r-python-pipeline",
    "snakemake-compact",
    "shell-scripting",
    "scverse",
    "scverse-compact",
    "plotly",
    "plotly-compact",
    "pixi",
    "general-agentic",
    "bfabricpy",
    "bookdown",
    "school-study-materials",
    "advanced-r-engineering",
    "anndata-proteomics",
    "design-principles",
    "polymorphism-over-discrimination",
    "review",
    "skill-development",
    "software-engineering-judgment",
]
agents = [
    "agents/r-development.md",
    "agents/dry-audit.md",
    "agents/dead-code-audit.md",
]

[skills.posit-dev-skills]
paths = [
    "r-lib/r-package-development",
    "r-lib/r-testthat",
    "r-lib/r-cli-app",
    "r-lib/r-cli",
    "r-lib/r-lifecycle",
    "r-lib/r-tidyverse-style",
    "r-lib/r-cran-status",
    "shiny/shiny-r-optimize",
]

[skills.marimo-team-skills]
paths = [
    "skills/marimo-notebook",
    "skills/marimo-batch",
    "skills/streamlit-to-marimo",
]

[skills.anthropics-skills]
paths = [
    "skills/skill-creator",
]

[skills.fgcz-skills]
paths = [
    # proteomics
    "proteomics-data-analysis/skills/prolfquapp-dea",
    "proteomics-data-analysis/skills/fix-prolfqua-dea-app",
    "proteomics-data-analysis/skills/adding-models-to-prolfqua",
